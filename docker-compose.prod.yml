version: '3.8'

services:
  # 🧠 Constitutional AI
  ai-orchestrator:
    build: ./services/ai-orchestrator
    ports:
      - "3014:3014"
    environment:
      - PORT=3014
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  # 🔐 Authentication
  azora-auth:
    build: ./services/azora-auth
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  # ⛓️ Blockchain & Tokenomics
  azora-mint:
    build: ./services/azora-mint
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  # 💰 Payments
  azora-pay:
    build: ./services/azora-pay
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  # 🐵 Antifragile Infrastructure
  chaos-monkey:
    build: ./services/chaos-monkey
    ports:
      - "3050:3050"
    environment:
      - PORT=3050
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  phoenix-server:
    build: ./services/phoenix-server
    ports:
      - "3051:3051"
    environment:
      - PORT=3051
      - NODE_ENV=production
    restart: always
    networks:
      - azora-net

  # 🔮 Citadel PredAISensor (Central Nervous System)
  citadel-predai-sensor:
    build: ./services/citadel-predai-sensor
    ports:
      - "3015:3015"
    environment:
      - PORT=3015
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /azora/citadel-predai-sensor
        awslogs-create-group: "true"
    restart: always
    networks:
      - azora-net

  # 🛡️ Network & Security
  az-vpn:
    image: lscr.io/linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - SERVERURL=vpn.azora.world
      - SERVERPORT=51820
      - PEERS=phone,vivobook
      - PEERDNS=10.0.0.1
      - INTERNAL_SUBNET=10.0.0.0
    volumes:
      - ./services/az-vpn/config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.ip_forward=1
    restart: always
    networks:
      - azora-net

  az-vpn-ui:
    image: ngoduykhanh/wireguard-ui:latest
    depends_on:
      - az-vpn
    cap_add:
      - NET_ADMIN
    environment:
      - WGUI_USERNAME=admin
      - WGUI_PASSWORD=admin
      - WGUI_MANAGE_START=true
      - WGUI_MANAGE_RESTART=true
    volumes:
      - ./services/az-vpn/config:/etc/wireguard
    ports:
      - "5000:5000"
    restart: always
    networks:
      - azora-net

networks:
  azora-net:
    driver: bridge
