<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sankofa Search</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
        }

        h2 {
            color: #D4AF37;
            /* Citadel Gold */
            border-bottom: 1px solid #800000;
            /* Sankofa Maroon */
            padding-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        button {
            background-color: #800000;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #a00000;
        }

        #results {
            margin-top: 20px;
        }

        .result-item {
            background-color: #252525;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid #D4AF37;
        }

        .result-title {
            font-weight: bold;
            color: #D4AF37;
            text-decoration: none;
        }

        .result-snippet {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h2>Sankofa Search</h2>
    <input type="text" id="query" placeholder="Search your history...">
    <button id="searchBtn">Search</button>
    <div id="results"></div>
    <script src="sidepanel.js"></script>
</body>

</html>
