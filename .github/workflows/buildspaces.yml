name: Build BuildSpaces

on:
  push:
    paths:
      - "apps/azora-buildspaces/**"
      - "apps/buildspaces-ui-reference/**"
      - ".github/workflows/buildspaces.yml"
  pull_request:
    paths:
      - "apps/azora-buildspaces/**"
      - "apps/buildspaces-ui-reference/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev build-essential python3 make g++

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (buildspaces)
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run unit tests (azora-buildspaces)
        run: pnpm -w -F azora-buildspaces test --if-present

      - name: Verify monitoring & infra env
        run: node apps/azora-buildspaces/scripts/verify-env.js
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Build azora-buildspaces
        run: pnpm -w -F azora-buildspaces build

      - name: Build buildspaces-ui-reference
        run: pnpm -w -F buildspaces-ui-reference build

      - name: Smoke test (start and curl)
        run: |
          pnpm -w -F azora-buildspaces start &
          sleep 5
          curl -sSf http://localhost:3000/ || exit 1
          pkill -f "next start" || true

      - name: Run migrations (if DATABASE_URL)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

  migrate:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy (main)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm -w exec prisma migrate deploy --schema=prisma/schema.prisma

  e2e:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -w -F azora-buildspaces playwright:install

      - name: Build and start app
        run: |
          pnpm -w -F azora-buildspaces build
          pnpm -w -F azora-buildspaces start &
          sleep 8

      - name: Run Playwright E2E tests
        run: pnpm -w -F azora-buildspaces test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/azora-buildspaces/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/azora-buildspaces
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/azora-buildspaces/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run npm audit
        run: pnpm -w -F azora-buildspaces audit --audit-level=high || true
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 30
        continue-on-error: true

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://buildspaces-staging.azora.dev
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          IMAGE_TAG="develop-${{ github.sha }}"
          IMAGE="ghcr.io/${{ github.repository }}/azora-buildspaces:$IMAGE_TAG"

          # Replace image in deployment manifest
          sed -i "s|image: azora/buildspaces:latest|image: $IMAGE|g" apps/azora-buildspaces/k8s/buildspaces-deployment.yaml

          # Apply manifests
          kubectl apply -f apps/azora-buildspaces/k8s/buildspaces-namespace.yaml
          # We skip applying buildspaces-secrets.yaml here as it contains placeholders.
          # In a real scenario, secrets would be managed via external-secrets or pre-created.
          kubectl apply -f apps/azora-buildspaces/k8s/postgres-deployment.yaml
          kubectl apply -f apps/azora-buildspaces/k8s/redis-deployment.yaml
          kubectl apply -f apps/azora-buildspaces/k8s/buildspaces-deployment.yaml
          kubectl apply -f apps/azora-buildspaces/k8s/buildspaces-ingress.yaml
        env:
          KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Verify staging env
        run: node apps/azora-buildspaces/scripts/verify-env.js
        env:
          NODE_ENV: staging
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://buildspaces-staging.azora.dev

      - name: Run migrations on staging (if STAGING_DATABASE_URL)
        if: env.STAGING_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "Running prisma migrate deploy against staging DB"
          pnpm -w exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Health check
        run: |
          echo "⏳ Waiting for deployment..."
          sleep 30
          echo "🔍 Running health check..."
          curl -f https://buildspaces-staging.azora.dev/api/health || exit 1
          echo "✅ Staging deployment successful"

  staging-e2e:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -w -F azora-buildspaces playwright:install

      - name: Run Playwright E2E tests against staging
        env:
          PLAYWRIGHT_BASE_URL: https://buildspaces-staging.azora.dev
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_ID: ${{ secrets.GITHUB_ID }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}
        run: pnpm -w -F azora-buildspaces test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: apps/azora-buildspaces/playwright-report
          retention-days: 7
